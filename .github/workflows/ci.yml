name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test
      - run: npm pack --dry-run
      - name: Load the package in n8n 2.42.3
        run: bash scripts/smoke-docker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-load-evidence
          path: artifacts/n8n-load.log
